name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Non-secret local-dev Supabase values (fixed defaults baked into every fresh
# `supabase start`, matching supabase/config.toml — same ones used in
# playwright.config.ts and scripts/.env.local). Safe to commit.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    env:
      # scripts/seed.ts's own config — kept distinct from the app's
      # NEXT_PUBLIC_ vars so it can never accidentally target a real DB.
      SEED_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      # Applies migrations + supabase/seed.sql (divisions/work_types) — the
      # same local stack used in development.
      - run: supabase start
      # Read the seed script's service key off the running stack instead of
      # committing it. It's a fixed local default — identical on every machine,
      # reachable only on 127.0.0.1 — but a literal `sb_secret_…` in the repo
      # trips GitHub's push protection and reads like a leaked credential to
      # anyone skimming. Deriving it also survives the CLI changing its
      # defaults.
      - name: Export the local Supabase secret key
        run: |
          key=$(supabase status -o env | sed -n 's/^SECRET_KEY="\(.*\)"$/\1/p')
          if [ -z "$key" ]; then
            echo "Could not read SECRET_KEY from \`supabase status -o env\`" >&2
            exit 1
          fi
          echo "::add-mask::$key"
          echo "SEED_SUPABASE_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
